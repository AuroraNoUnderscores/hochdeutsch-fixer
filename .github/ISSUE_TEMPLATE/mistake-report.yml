name: Mistake report
description: A Swiss word the extension left alone, or a change it should not have made (the popup's "Report a mistake" opens this, prefilled)
title: "Mistake: "
labels: ["mistake-report"]
body:
  - type: markdown
    attributes:
      value: |
        Reports like this are collected and used to patch the dictionary and rules.
        This issue is public: delete the page address below if the page is private.
  - type: input
    id: kind
    attributes:
      label: Kind
      description: "Missed: left unchanged, or Wrong: changed, but should stay"
    validations:
      required: true
  - type: input
    id: word
    attributes:
      label: Word or phrase
      description: As the site wrote it.
    validations:
      required: true
  - type: input
    id: changed
    attributes:
      label: What the extension changed it to
      description: Wrong changes only.
  - type: input
    id: expected
    attributes:
      label: What it should be
      description: Missed words only; the German Standard German replacement, if you know it.
  - type: input
    id: why
    attributes:
      label: Why it changed (from the hover card)
  - type: textarea
    id: context
    attributes:
      label: Sentence around it
      description: As the site wrote it.
  - type: input
    id: page
    attributes:
      label: Page
      description: Address without query or fragment. Optional.
  - type: input
    id: note
    attributes:
      label: Note
  - type: input
    id: info
    attributes:
      label: Version and settings
