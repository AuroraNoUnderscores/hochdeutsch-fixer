<!doctype html>
<meta charset="utf-8">
<style>
  :root { --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --accent: #e2001a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #2b2a33; --fg: #fbfbfe; --muted: #a8a8b3; --line: #45444f; } }
  body { margin: 0; width: 280px; font: 13px system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { padding: 12px 14px; font-weight: 600; border-bottom: 1px solid var(--line); }
  header b { color: var(--accent); }
  label { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 14px; cursor: pointer; }
  label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  select { font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 2px 4px; }
  .foot { padding: 9px 14px 12px; color: var(--muted); border-top: 1px solid var(--line); line-height: 1.5; }
  #bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 5px; }
  #bar div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  #log { margin-top: 6px; font-size: 11px; line-height: 1.6; }
  #log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log b { font-weight: 600; color: var(--fg); }
  #log .kept { opacity: .65; }
  button { font: inherit; width: calc(100% - 28px); margin: 2px 14px 8px; padding: 5px 0; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #changes { border-top: 1px solid var(--line); padding: 8px 14px; max-height: 240px; overflow-y: auto; font-size: 12px; line-height: 1.55; }
  #changes h4 { margin: 6px 0 2px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #changes h4:first-child { margin-top: 0; }
  #changes div { display: flex; gap: 6px; }
  #changes .words { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #changes s { color: var(--muted); }
  #changes .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  #changes .empty { color: var(--muted); }
</style>
<header><b>Moin!</b> Hochdeutsch-Fixer</header>
<label>Enabled <input type="checkbox" id="enabled"></label>
<label id="site-row"><span>On <b id="site-label"></b></span> <input type="checkbox" id="site"></label>
<label><span>Flavour</span>
  <select id="mode">
    <option value="hamburg">Hamburg</option>
    <option value="neutral">Neutral</option>
  </select>
</label>
<label><span>Baby LLM</span> <input type="checkbox" id="llm"></label>
<label><span>Highlight changes on page</span> <input type="checkbox" id="highlight"></label>
<button id="show-changes" aria-pressed="false">Show changed words</button>
<div id="changes" hidden></div>
<div class="foot">
  <div id="count"></div>
  <div id="llm-status"></div>
  <div id="bar" hidden><div></div></div>
  <div id="log"></div>
</div>
<script src="popup.js"></script>
